<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shasvi's Play & Learn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka for friendly, rounded toddler-safe typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base iPad & Toddler Touch Optimizations */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            background: linear-gradient(135deg, #FFF8E7 0%, #E0F7FA 50%, #F3E5F5 100%);
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }

        /* Floating Clouds & Background Decor */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* Gentle Shake for Wrong Tap (Non-punitive) */
        @keyframes gentleWobble {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-10px) rotate(-4deg); }
            40% { transform: translateX(10px) rotate(4deg); }
            60% { transform: translateX(-7px) rotate(-2deg); }
            80% { transform: translateX(7px) rotate(2deg); }
        }
        .animate-wobble {
            animation: gentleWobble 0.55s ease-in-out;
        }

        /* Celebratory Bounce on Correct Answer */
        @keyframes happyBounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.18) rotate(-3deg); }
            60% { transform: scale(0.95) rotate(3deg); }
            80% { transform: scale(1.08); }
        }
        .animate-celebrate {
            animation: happyBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Tactile 3D Toy Card Press Effect */
        .toy-btn {
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease;
        }
        .toy-btn:active {
            transform: translateY(6px) scale(0.97);
        }

        /* Pulse Ring for Speaker Button */
        @keyframes pulseRing {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .speaker-pulse {
            animation: pulseRing 2s infinite;
        }

        /* Confetti Canvas Overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Parent Lock Progress Ring */
        .lock-progress-circle {
            transition: stroke-dashoffset 0.05s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>

    <script>
        /**
         * ============================================================================
         * 1. OFFLINE WEB AUDIO SYNTHESIZER (Chimes, Pops, Fanfare, Gentle Boop)
         * ============================================================================
         */
        class ToddlerAudioEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Cheerful bubble pop on tap
            playPop() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }

            // Gentle soft marimba wobble for wrong guess (never harsh!)
            playGentleBoop() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                const now = this.ctx.currentTime;
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.linearRampToValueAtTime(190, now + 0.22);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            // Bright sparkly fanfare arpeggio for correct answer
            playCelebration() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                const now = this.ctx.currentTime;

                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    
                    const startTime = now + idx * 0.09;
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.01, startTime);
                    gain.gain.linearRampToValueAtTime(0.28, startTime + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.46);
                });
            }
        }

        const soundFX = new ToddlerAudioEngine();

        /**
         * ============================================================================
         * 2. ENTHUSIASTIC WEB SPEECH ENGINE (Optimized for Toddler Clarity)
         * ============================================================================
         */
        let preferredVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            // Prefer friendly, warm English voices available on iPadOS (Samantha, Karen, Moira, etc.)
            preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Karen') || v.name.includes('Google US English')))
                          || voices.find(v => v.lang.startsWith('en'));
        }
        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function speakPrompt(text, rate = 0.92, pitch = 1.18) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Interrupt stale speech cleanly

            const utterance = new SpeechSynthesisUtterance(text);
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.rate = rate;   // Slightly slower so a 2.5yo catches every word
            utterance.pitch = pitch; // Warm, upbeat, friendly inflection
            utterance.volume = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        /**

         */

            }

        const COUNT_EMOJIS = ['🍎', '⭐', '🍓', '🐶', '🦆', '🎈', '🍪', '🦋', '🚗', '🍌'];
        const NUMBERS_DATA = Array.from({ length: 10 }, (_, i) => {

            { letter: 'P', word: 'Pig', phonetic: 'Puh', emoji: '🐷' },

            { letter: 'R', word: 'Rabbit', phonetic: 'Rrr', emoji: '🐰' },

            { letter: 'T', word: 'Train', phonetic: 'Tuh', emoji: '🚂' },
            { letter: 'U', word: 'Umbrella', phonetic: 'Uh', emoji: '☂️' },
            { letter: 'V', word: 'Violin', phonetic: 'Vvv', emoji: '🎻' },
            { letter: 'W', word: 'Whale', phonetic: 'Wuh', emoji: '🐳' },

            { letter: 'Z', word: 'Zebra', phonetic: 'Zzz', emoji: '🦓' }
        ];

        const COLORS_DATA = [
            { id: 'red', name: 'Red', hex: '#EF4444', shadow: '#b91c1c', emoji: '🍓' },
            { id: 'blue', name: 'Blue', hex: '#3B82F6', shadow: '#1d4ed8', emoji: '🐳' },
            { id: 'yellow', name: 'Yellow', hex: '#FACC15', shadow: '#ca8a04', emoji: '🍌' },
            { id: 'green', name: 'Green', hex: '#22C55E', shadow: '#15803d', emoji: '🐸' },
            { id: 'orange', name: 'Orange', hex: '#F97316', shadow: '#c2410c', emoji: '🍊' },
            { id: 'purple', name: 'Purple', hex: '#A855F7', shadow: '#7e22ce', emoji: '🍇' }
        ];

        const PRAISE_PHRASES = [
            "Yay! Great job Shasvi!",
            "Woohoo! You did it Shasvi!",
            "Super star Shasvi!",
            "Amazing job Shasvi!",
            "Hooray! That's right Shasvi!"
        ];

        const GENTLE_PROMPTS = [
            "Oopsie! Let's try again!",
            "Almost! Look closely Shasvi!",
            "You can do it! Try another one!"
        ];

        /**
         * ============================================================================
         * 4. GAME STATE & ROUND GENERATOR
         * ============================================================================
         */
        let currentGame = null;
        let currentTarget = null;
        let currentPromptSpeech = '';
        let starsEarned = 0;
        let isTransitioning = false;
        let lastTargetId = null;

        // Shuffle helper
        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // Pick 3 unique items ensuring the target isn't identical to the previous round
        function pickThreeChoices(pool, idKey) {
            let candidates = pool.filter(item => item[idKey] !== lastTargetId);
            if (candidates.length === 0) candidates = pool;
            const target = candidates[Math.floor(Math.random() * candidates.length)];
            lastTargetId = target[idKey];

            const distractors = shuffle(pool.filter(item => item[idKey] !== target[idKey])).slice(0, 2);
            return {
                target,
                choices: shuffle([target, ...distractors])
            };
        }

        function startGame(gameType) {
            soundFX.playPop();
            currentGame = gameType;
            lastTargetId = null;

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('game-view').classList.add('flex');
            document.getElementById('top-bar').classList.remove('hidden');

            nextRound();
        }

        function returnHome() {
            soundFX.playPop();
            currentGame = null;
            window.speechSynthesis.cancel();

            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('flex');
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');

            speakPrompt("Hi Shasvi! Pick a game to play!");
        }

        function nextRound() {
            isTransitioning = false;
            const grid = document.getElementById('choices-grid');
            grid.innerHTML = '';

            if (currentGame === 'shapes') {
                const { target, choices } = pickThreeChoices(SHAPES_DATA, 'id');
                currentTarget = target.id;
                currentPromptSpeech = `Hi Shasvi! Can you find the ${target.name}?`;
                document.getElementById('prompt-text').textContent = `Find the ${target.name}!`;

                choices.forEach(item => {
                    const btn = createCardButton(item.id, item.bg);
                    btn.innerHTML = `
                        <div class="flex-1 flex items-center justify-center">${item.svg}</div>
                        <span class="text-3xl md:text-4xl font-bold text-slate-800 mt-3">${item.name}</span>
                    `;
                    grid.appendChild(btn);
                });
            } 
            else if (currentGame === 'numbers') {
                const { target, choices } = pickThreeChoices(NUMBERS_DATA, 'id');
                currentTarget = target.id;
                currentPromptSpeech = `Shasvi, where is the number ${target.value}?`;
                document.getElementById('prompt-text').textContent = `Find number ${target.value}!`;

                choices.forEach(item => {
                    const btn = createCardButton(item.id, 'bg-white border-amber-300 shadow-[0_12px_0_#fcd34d]');
                    // Render countable objects cleanly in a flexible wrap grid
                    const objectsHTML = Array(item.value).fill(`<span class="text-3xl sm:text-4xl md:text-5xl leading-none">${item.emoji}</span>`).join('');
                    btn.innerHTML = `
                        <span class="text-6xl sm:text-7xl md:text-8xl font-bold text-orange-500 leading-none mb-3">${item.value}</span>
                        <div class="flex flex-wrap items-center justify-center gap-1.5 max-w-[220px] px-2">
                            ${objectsHTML}
                        </div>
                    `;
                    grid.appendChild(btn);
                });
            } 
            else if (currentGame === 'letters') {
                const { target, choices } = pickThreeChoices(LETTERS_DATA, 'letter');
                currentTarget = target.letter;
                currentPromptSpeech = `Shasvi, find the letter ${target.letter}! ${target.letter} is for ${target.word}!`;
                document.getElementById('prompt-text').textContent = `Find "${target.letter}" for ${target.word}!`;

                choices.forEach(item => {
                    const btn = createCardButton(item.letter, 'bg-white border-sky-300 shadow-[0_12px_0_#7dd3fc]');
                    btn.innerHTML = `
                        <span class="text-6xl sm:text-7xl md:text-8xl font-bold text-blue-600 leading-none">${item.letter}</span>
                        <span class="text-5xl sm:text-6xl my-2">${item.emoji}</span>
                        <span class="text-2xl md:text-3xl font-bold text-slate-600">${item.word}</span>
                    `;
                    grid.appendChild(btn);
                });
            } 
            else if (currentGame === 'colors') {
                const { target, choices } = pickThreeChoices(COLORS_DATA, 'id');
                currentTarget = target.id;
                currentPromptSpeech = `Hi Shasvi! Can you tap the color ${target.name}?`;
                document.getElementById('prompt-text').textContent = `Tap ${target.name}!`;

                choices.forEach(item => {
                    const btn = document.createElement('button');
                    btn.dataset.choiceId = item.id;
                    btn.style.backgroundColor = item.hex;
                    btn.style.boxShadow = `0 12px 0 ${item.shadow}`;
                    btn.className = `toy-btn rounded-[2.5rem] p-6 border-4 border-white/80 flex flex-col items-center justify-center cursor-pointer transition-transform`;
                    btn.innerHTML = `
                        <span class="text-6xl sm:text-7xl md:text-8xl mb-3 drop-shadow">${item.emoji}</span>
                        <span class="bg-white/95 px-6 py-2 rounded-full text-2xl sm:text-3xl md:text-4xl font-bold text-slate-800 shadow-sm">${item.name}</span>
                    `;
                    btn.addEventListener('click', () => handleChoiceTap(btn, item.id));
                    grid.appendChild(btn);
                });
            }

            speakPrompt(currentPromptSpeech);
        }

        function createCardButton(choiceId, extraClasses) {
            const btn = document.createElement('button');
            btn.dataset.choiceId = choiceId;
            btn.className = `toy-btn rounded-[2.5rem] p-5 md:p-6 border-4 flex flex-col items-center justify-center cursor-pointer ${extraClasses}`;
            btn.addEventListener('click', () => handleChoiceTap(btn, choiceId));
            return btn;
        }

        /**
         * ============================================================================
         * 5. TAP INTERACTION & CELEBRATION LOGIC
         * ============================================================================
         */
        function handleChoiceTap(btnElement, tappedId) {
            if (isTransitioning) return;

            if (tappedId === currentTarget) {
                // CORRECT!
                isTransitioning = true;
                starsEarned++;
                document.getElementById('star-count').textContent = starsEarned;

                soundFX.playCelebration();
                btnElement.classList.add('animate-celebrate', 'ring-8', 'ring-amber-300');
                launchConfetti();

                const praise = PRAISE_PHRASES[Math.floor(Math.random() * PRAISE_PHRASES.length)];
                speakPrompt(praise, 0.96, 1.25);

                setTimeout(() => {
                    nextRound();
                }, 2300);
            } else {
                // GENTLE ENCOURAGEMENT (No harsh buzzers, soft shake + repeat prompt)
                soundFX.playGentleBoop();
                btnElement.classList.remove('animate-wobble');
                void btnElement.offsetWidth; // Trigger reflow to restart animation
                btnElement.classList.add('animate-wobble');

                showEncouragementToast();
                const gentle = GENTLE_PROMPTS[Math.floor(Math.random() * GENTLE_PROMPTS.length)];
                speakPrompt(`${gentle} ${currentPromptSpeech}`);
            }
        }

        function showEncouragementToast() {
            const pill = document.getElementById('encouragement-pill');
            const emojis = ['🤗', '🌟', '💛', '🌈'];
            document.getElementById('encouragement-emoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
            pill.classList.remove('opacity-0');
            clearTimeout(pill._hideTimer);
            pill._hideTimer = setTimeout(() => {
                pill.classList.add('opacity-0');
            }, 1800);
        }

        /**
         * ============================================================================
         * 6. PARENT-LOCK HOME BUTTON (Hold 1.5s to prevent toddler accidental exit)
         * ============================================================================
         */
        const homeBtn = document.getElementById('home-lock-btn');
        const lockRing = document.getElementById('lock-ring');
        const CIRCUMFERENCE = 2 * Math.PI * 16; // ~100.53
        let holdInterval = null;
        let holdStartTime = 0;
        const HOLD_DURATION = 1500; // 1.5 seconds

        function startHold(e) {
            e.preventDefault();
            holdStartTime = Date.now();
            clearInterval(holdInterval);

            holdInterval = setInterval(() => {
                const elapsed = Date.now() - holdStartTime;
                const progress = Math.min(elapsed / HOLD_DURATION, 1);
                lockRing.style.strokeDashoffset = CIRCUMFERENCE * (1 - progress);

                if (progress >= 1) {
                    clearInterval(holdInterval);
                    lockRing.style.strokeDashoffset = CIRCUMFERENCE;
                    returnHome();
                }
            }, 30);
        }

        function cancelHold() {
            clearInterval(holdInterval);
            lockRing.style.strokeDashoffset = CIRCUMFERENCE;
        }

        homeBtn.addEventListener('mousedown', startHold);
        homeBtn.addEventListener('touchstart', startHold, { passive: false });
        homeBtn.addEventListener('mouseup', cancelHold);
        homeBtn.addEventListener('mouseleave', cancelHold);
        homeBtn.addEventListener('touchend', cancelHold);
        homeBtn.addEventListener('touchcancel', cancelHold);

        // Repeat prompt button
        document.getElementById('repeat-prompt-btn').addEventListener('click', () => {
            soundFX.playPop();
            if (currentPromptSpeech) {
                speakPrompt(currentPromptSpeech);
            }
        });

        // Start overlay unlock button (initializes iPad audio + speech cleanly)
        document.getElementById('start-play-btn').addEventListener('click', () => {
            soundFX.init();
            soundFX.playCelebration();
            document.getElementById('start-overlay').classList.add('hidden');
            speakPrompt("Hi Shasvi! Welcome! Tap a colorful card to play!");
        });

        /**
         * ============================================================================
         * 7. CONFETTI BURST PARTICLE SYSTEM (Canvas)
         * ============================================================================
         */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchConfetti() {
            const colors = ['#FF4D6D', '#FACC15', '#3B82F6', '#10B981', '#A855F7', '#F97316'];
            for (let i = 0; i < 85; i++) {
                particles.push({
                    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
                    y: canvas.height / 2 + 40,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 1.2) * 18 - 4,
                    size: Math.random() * 12 + 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 14,
                    shape: Math.random() > 0.5 ? 'circle' : 'rect'
                });
            }
            if (!animationFrameId) {
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.45; // Gravity
                p.vx *= 0.98;
                p.rotation += p.rotSpeed;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;

                if (p.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                }
                ctx.restore();

                if (p.y > canvas.height + 40) {
                    particles.splice(idx, 1);
                }
            });

            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateConfetti);
            } else {
                animationFrameId = null;
            }
        }
    </script>
</body>
